name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debug symbols across every test binary exhaust hosted Linux disks.
  # Disabling debug info keeps assertions and overflow checks enabled.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'

  groundtruth:
    name: Ground truth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tools/groundtruth/tests
      - run: python -m tools.groundtruth check
      # The committed price catalog must be exactly what the vendored
      # genai-prices data plus the cited overlay compile to.
      - run: python -m unittest discover -s tools/pricing/tests -t .
      - run: python -m tools.pricing generate --check

  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo test --workspace --all-features --locked

  npm:
    name: npm packages and app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@12.0.1
      - run: npm ci --ignore-scripts
      - name: Typecheck and build packages and app
        run: npm run build
      - name: SDK and complete app unit suite
        run: npm test
      - name: Check API documentation against the service contract
        run: node docs/site/scripts/build.mjs --check
      - name: Verify tarballs in a clean consumer
        run: npm run check:packages
      - name: Install Electron for room integration tests
        run: node -p 'require("electron")'
      - name: Exercise room host in Electron
        # The hosted runner cannot use Chromium's unconfigured SUID helper.
        # This flag applies only to this local fixture on the disposable CI VM.
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run test:room-host -w @vibefield/rosetta-agent-history -- --no-sandbox

  check:
    name: CI passed
    if: always()
    needs: [workflows, groundtruth, quality, test, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          PY
