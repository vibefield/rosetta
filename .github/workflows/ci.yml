name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @stable would override the rust-toolchain.toml pin (review finding)
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s tools/groundtruth/tests
      - run: python3 -m tools.groundtruth check
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

# release-watch.yml (cron: poll every agent's watch.toml channel -> run the
# Python fixture farm -> open drift PR) is added with release automation. See
# docs/groundtruth/RESEARCH_PLAN.md §3.
