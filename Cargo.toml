[workspace]
resolver = "3"
members = [
    "crates/adapter-support",
    "crates/adapters/antigravity",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/adapters/copilot",
    "crates/adapters/grok",
    "crates/adapters/hermes",
    "crates/adapters/kimi-code",
    "crates/adapters/opencode",
    "crates/adapters/pi",
    "crates/bench-corpus",
    "crates/capture",
    "crates/core",
    "crates/pipeline",
    "crates/protocol",
    "crates/rosettad",
    "crates/server",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
