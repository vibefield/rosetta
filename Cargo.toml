[workspace]
resolver = "3"
members = [
    "crates/adapter-support",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/capture",
    "crates/core",
    "crates/pipeline",
    "crates/protocol",
    "crates/rosettad",
    "crates/server",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
