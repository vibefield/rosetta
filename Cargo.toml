[workspace]
resolver = "3"
members = [
    "crates/adapter-support",
    "crates/adapters/antigravity",
    "crates/adapters/claude-code",
    "crates/adapters/codex",
    "crates/adapters/copilot",
    "crates/adapters/grok",
    "crates/adapters/hermes",
    "crates/adapters/kimi-code",
    "crates/adapters/opencode",
    "crates/adapters/pi",
    "crates/bench-corpus",
    "crates/capture",
    "crates/core",
    "crates/pipeline",
    "crates/protocol",
    "crates/rosettad",
    "crates/search",
    "crates/search-bench",
    "crates/server",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
base64 = "0.22.1"
notify = "8"
rusqlite = { version = "0.32", features = ["backup", "bundled", "unlock_notify"] }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
time = { version = "0.3", features = ["parsing"] }
zstd = { version = "0.13", default-features = false }
