[package]
name = "rosetta-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript binding generation (ts-rs) for the wire-visible row types.
# Enabled by rosetta-protocol; never on by default.
ts = ["dep:ts-rs"]
