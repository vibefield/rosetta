# Rosetta price overlay (docs/ARCHITECTURE.md §4.1.3). Cited additions to the
# vendored genai-prices data, compiled into crates/pricing/src/generated.rs by
# `python3 -m tools.pricing generate`. Every entry names its source. Never
# derive a rate from another rate unless the provider documents the multiplier.
#
#   [[alias]]  an exact extra spelling of a catalog model
#   [[tier]]   a service-tier multiplier on the standard cost (model-specific
#              rules win over provider-wide ones; a tier without a rule is
#              unpriced)
#   [[route]]  a residency/regional premium for a qualified route
#   [[model]]  a model genai-prices does not list; prices are decimal strings

[[alias]]
alias = "k3"
provider = "moonshotai"
model = "kimi-k3"
source = """Kimi Code records the Moonshot K3 model as `k3` (groundtruth/kimi-code census \
observed-2026-08-26: session model = "k3"); Moonshot lists it as `kimi-k3` \
(https://platform.kimi.ai/docs/pricing/chat-k3.md)."""

[[tier]]
provider = "anthropic"
tier = "batch"
multiplier = "1/2"
source = """Anthropic Message Batches are billed at 50% of standard prices \
(https://platform.claude.com/docs/en/build-with-claude/batch-processing#pricing)."""

[[tier]]
provider = "openai"
tier = "batch"
multiplier = "1/2"
source = """OpenAI Batch API requests are billed at 50% of standard prices \
(https://developers.openai.com/api/docs/pricing); LiteLLM 58a05a9e *_batches rates agree."""

[[tier]]
provider = "openai"
tier = "flex"
multiplier = "1/2"
source = """OpenAI Flex processing is billed at Batch API rates \
(https://developers.openai.com/api/docs/guides/flex-processing); LiteLLM 58a05a9e *_flex rates \
are 0.5x standard for gpt-5.4, gpt-5.5, gpt-5.6-sol, gpt-5.6-terra and gpt-6-astra."""

[[tier]]
provider = "openai"
model = "gpt-5.4"
tier = "priority"
multiplier = "2"
source = """LiteLLM 58a05a9e model_prices_and_context_window.json: gpt-5.4 *_priority rates are \
2x standard for input, cached input and output (https://developers.openai.com/api/docs/pricing)."""

[[tier]]
provider = "openai"
model = "gpt-5.5"
tier = "priority"
multiplier = "5/2"
source = """LiteLLM 58a05a9e model_prices_and_context_window.json: gpt-5.5 *_priority rates are \
2.5x standard for input, cached input and output (https://developers.openai.com/api/docs/pricing)."""

[[tier]]
provider = "openai"
model = "gpt-5.6-sol"
tier = "priority"
multiplier = "2"
source = """LiteLLM 58a05a9e model_prices_and_context_window.json: gpt-5.6-sol *_priority rates are \
2x standard for every unit, including the >272K tier (https://developers.openai.com/api/docs/pricing)."""

[[tier]]
provider = "openai"
model = "gpt-5.6-terra"
tier = "priority"
multiplier = "2"
source = """LiteLLM 58a05a9e model_prices_and_context_window.json: gpt-5.6-terra *_priority rates are \
2x standard for every unit, including the >272K tier (https://developers.openai.com/api/docs/pricing)."""

[[tier]]
provider = "openai"
model = "gpt-6-astra"
tier = "priority"
multiplier = "2"
source = """LiteLLM 58a05a9e model_prices_and_context_window.json: gpt-6-astra *_priority rates are \
2x standard for every unit, including the >272K tier (https://developers.openai.com/api/docs/pricing)."""
