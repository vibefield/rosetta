# Rosetta price overlay (docs/ARCHITECTURE.md §4.1.3). Cited additions to the
# vendored genai-prices data, compiled into crates/pricing/src/generated.rs by
# `python3 -m tools.pricing generate`. Every entry names its source. Never
# derive a rate from another rate unless the provider documents the multiplier.
#
#   [[alias]]  an exact extra spelling of a catalog model (`replaces =
#              "provider/model"` re-points an upstream spelling deliberately)
#   [[model]]  a model genai-prices does not list; prices are decimal strings,
#              optionally dated like upstream's (`[{ constraint = { start_date
#              = … }, prices = … }]`); `aliases` lists its other spellings
#   [[patch]]  a correction or completion of an upstream model's rates: the
#              named units replace or join the existing ones in every period
#   [[tier]]   a service-tier multiplier on the standard token cost
#              (model-specific rules win over provider-wide ones; a tier
#              without a rule is unpriced; `tiers = [...]` covers spellings a
#              provider accepts interchangeably; `from`/`until` date a rule)
#   [[route]]  a residency/regional premium for a qualified route, dated the
#              same way
#
# Free or discounted servings of a listed model (Grok Build, OpenCode Zen
# `*-free`) alias the listed model: the figure is what the usage would cost
# at the creator's list price (product decision, 2026-09-24).

