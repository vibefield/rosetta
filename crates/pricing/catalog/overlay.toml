# ── Models genai-prices does not list ──────────────────────────────────────

[[model]]
provider = "x-ai"
id = "grok-4.7"
name = "Grok 4.7"
aliases = ["grok-4.7-build"]
source = """xAI lists grok-4.7 at $2.00 input / $0.50 cached / $6.00 output per MTok below 200K \
prompt tokens and $4.00 / $1.00 / $12.00 at or above it, "requests whose prompt reaches the listed \
token threshold are billed at the higher rate for all tokens in the request" \
(https://docs.x.ai/developers/pricing, 2026-09-24). Grok Build records it as `grok-4.7-build`; \
its `costUsdTicks` on 2026-09-23 is a Grok Build discount off this list, which the estimate ignores \
like grok-4.6-build's."""

[model.prices]
input_mtok = { base = "2", tiers = [{ start = 199999, price = "4" }] }
cache_read_mtok = { base = "0.5", tiers = [{ start = 199999, price = "1" }] }
output_mtok = { base = "6", tiers = [{ start = 199999, price = "12" }] }
# "Web Search | web_search | $5" per 1,000 calls (https://docs.x.ai/developers/pricing).
web_searches_kcount = "5"

[[model]]
provider = "x-ai"
id = "grok-4.7-fast"
name = "Grok 4.7 Fast"
aliases = ["grok-4.7-build-fast"]
source = """"Grok 4.7 Fast is the same Grok 4.7 model served on faster infrastructure, at twice the \
standard token rates": $4.00 input / $1.00 cached / $12.00 output per MTok below 200K prompt \
tokens and $6.00 / $1.50 / $18.00 above; "available only through Cursor and Grok Build" \
(https://docs.x.ai/developers/pricing, 2026-09-24). Grok Build records it as `grok-4.7-build-fast`."""

[model.prices]
input_mtok = { base = "4", tiers = [{ start = 199999, price = "6" }] }
cache_read_mtok = { base = "1", tiers = [{ start = 199999, price = "1.5" }] }
output_mtok = { base = "12", tiers = [{ start = 199999, price = "18" }] }
# "Web Search | web_search | $5" per 1,000 calls (https://docs.x.ai/developers/pricing).
web_searches_kcount = "5"

# ── Patches to upstream rates ──────────────────────────────────────────────

[[patch]]
provider = "moonshotai"
model = "kimi-k3"
prices = { cache_write_mtok = "3", cache_write_1h_mtok = "6" }
source = """Moonshot lists K3 cache writes at $3.00 per MTok for the 5-minute cache and $6.00 for \
the 1-hour cache, beside $3.00 input / $0.30 cache hit / $15.00 output \
(https://platform.kimi.ai/docs/pricing/chat-k3.md, 2026-09-23); genai-prices carries no write rates, \
which priced 1-hour writes at the input rate."""

