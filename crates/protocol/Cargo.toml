[package]
name = "rosetta-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rosetta-core = { path = "../core" }
rosetta-search = { path = "../search" }
rosetta-store = { path = "../store" }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript binding generation: `TS_RS_EXPORT_DIR=<abs path to clients/ts/generated>
# cargo test -p rosetta-protocol --features ts` regenerates the committed
# client types.
ts = ["dep:ts-rs", "rosetta-core/ts", "rosetta-search/ts", "rosetta-store/ts"]
