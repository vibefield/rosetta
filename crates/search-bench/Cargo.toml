[package]
name = "rosetta-search-bench"
version.workspace = true
edition.workspace = true
description = "Frozen-input FTS latency campaigns for Rosetta"

[lib]
name = "rosetta_search_bench"
path = "src/lib.rs"

[[bin]]
name = "search-bench"
path = "src/main.rs"

[[bin]]
name = "tantivy-bench"
path = "src/tantivy_main.rs"
required-features = ["tantivy-prototype"]

[dependencies]
blake3.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
rosetta-store = { path = "../store" }
tantivy = { version = "0.26.1", optional = true }

[features]
tantivy-prototype = ["dep:tantivy"]

[dev-dependencies]
rosetta-core = { path = "../core" }
tempfile.workspace = true
