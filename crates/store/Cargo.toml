[package]
name = "rosetta-store"
version.workspace = true
edition.workspace = true

[dependencies]
blake3.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
rosetta-core = { path = "../core" }
rosetta-pricing = { path = "../pricing" }
# Display renditions of image members (assets/renditions.rs): a pure kernel below storage.
rosetta-media = { path = "../media" }
tempfile.workspace = true
ts-rs = { workspace = true, optional = true }

# The placement's opens neither follow a link nor wait on a FIFO (assets/place.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
image.workspace = true

[features]
# TypeScript binding generation for the wire-visible hot-tier and query
# types. Enabled by rosetta-protocol; never on by default.
ts = ["dep:ts-rs", "rosetta-core/ts"]
