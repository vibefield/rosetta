format = "rosetta-layout/1"
agent = "antigravity"
data_root = "~/.gemini/antigravity-cli"

[[streams]]
id = "transcript"
glob = "brain/*/.system_generated/logs/transcript.jsonl"
file_format = "jsonl"
discipline = "append_only"
evidence = "fixture"
notes = "Primary transcript JSONL. Fixture 1.1.20: USER_INPUT, PLANNER_RESPONSE (optional tool_calls[{name,args}]), RUN_COMMAND (exit_code+content), CHECKPOINT, SYSTEM_MESSAGE. Organic census additionally: CONVERSATION_HISTORY (no content), LIST_DIRECTORY, VIEW_FILE, ERROR_MESSAGE (error+content). Envelope: type, source, status, step_index, created_at."

[[streams]]
id = "transcript-full"
glob = "brain/*/.system_generated/logs/transcript_full.jsonl"
file_format = "jsonl"
discipline = "append_only"
evidence = "fixture"
notes = "Sibling of transcript.jsonl. Hook stdin transcriptPath points here. Same record vocabulary as transcript."

[[streams]]
id = "transcript-chunks"
glob = "brain/*/.system_generated/logs/chunks/transcript/*.jsonl"
file_format = "jsonl"
discipline = "append_only"
evidence = "fixture"
notes = "Chunked copy of transcript.jsonl (00000000.jsonl in 1.1.20, same bytes as the parent file)."

[[streams]]
id = "transcript-full-chunks"
glob = "brain/*/.system_generated/logs/chunks/transcript_full/*.jsonl"
file_format = "jsonl"
discipline = "append_only"
evidence = "fixture"
notes = "Chunked copy of transcript_full.jsonl."

[[streams]]
id = "conversation-message-index"
glob = "brain/*/.system_generated/messages/read.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Map of message-id → bool (read). Resume fixture only. Keys are UUIDs and collapse to <dynamic> in the canonical shape."

[[streams]]
id = "conversation-messages"
glob = "brain/*/.system_generated/messages/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Per-message JSON (id, recipient, sender, priority, timestamp, hideFromUser, content). read.json is a separate stream and must be listed first so it does not merge into this shape."

[[streams]]
id = "undelivered-messages"
glob = "brain/*/.system_generated/messages/undelivered/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Empty undelivered/ dir created on resume in 1.1.20. Promote when a file appears."

[[streams]]
id = "conversation-db"
glob = "conversations/*.db*"
file_format = "sqlite"
discipline = "database"
evidence = "fixture"
notes = "Durable conversation store. One WAL-mode SQLite file per conversation UUID plus -wal/-shm. Schema dump identity is conversations.db (UUID filenames collapsed). Tables: steps (blob payloads), trajectory_meta, gen_metadata, executor_metadata, parent_references, trajectory_metadata_blob, battle_mode_infos. Schema dump: sources/<version>.sqlite-schema.sql. USAGE SOURCE, snapshot-driven (the transcript JSONL carries no token counts): trajectory_meta.cascade_id is the brain conversation UUID (session identity; one cascade per store). steps.metadata is protobuf exa.cortex_pb.CortexStepMetadata: created_at#1 (google.protobuf.Timestamp), model_usage#9 (exa.codeium_common_pb.ModelUsageStats: input_tokens#2 excludes cache reads; output_tokens#3 = thinking_output_tokens#9 + response_output_tokens#10; cache_write_tokens#4 deprecated and always 0; cache_read_tokens#5; service_tier#13 string, empty so far; model#1 and api_provider#6 enums whose names are placeholders), generator_model#11 (Model enum), retry_infos#28 (attempts; 1 on checkpoint steps, 0 on planner steps). gen_metadata.data is exa.cortex_pb.CortexStepGeneratorMetadata: step_indices#2 names the steps the generation wrote; chat_model#1 (exa.cortex_pb.ChatModelMetadata) carries usage#4 = the sum of retry_infos#17 attempts, response_model#19 = the only served-model string on disk (absent from the mock farm), model_display_name#21; model_cost#5, credit_cost#13 and consumed_credits#18 are plan credits, not USD. Steps that no generation names (CHECKPOINT summarizer calls) have usage but no model string. Field numbers and names come from the agy 1.2.9 FileDescriptorSet (sources/1.2.9.writer.json, facet protobuf); they decode every 1.1.20 fixture blob and the 2026-09-23 organic census with zero unknown fields. Payload columns (step_payload, executor_metadata, trajectory_metadata_blob) are never read."

[[streams]]
id = "conversation-summaries"
glob = "conversation_summaries.db*"
file_format = "sqlite"
discipline = "database"
evidence = "fixture"
notes = "Summary index: conversation_id, title, preview, step_count, workspace_uris, parent_conversation_id, app_data_dir, timestamps."

[[streams]]
id = "last-conversations"
glob = "cache/last_conversations.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Launch-cwd → conversation UUID for --continue/-c. Redacted farm keys collapse to <dynamic>."

[[streams]]
id = "conversation-metadata"
glob = "cache/conversation_metadata.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Cache of conversation summaries under conversations.<uuid>. UUID keys collapse to <dynamic>. Written on resume in 1.1.20."

[[streams]]
id = "settings"
glob = "settings.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Sparse user settings. Farm writes modelProvider=gemini (required for GEMINI_API_KEY) and toolPermission=always-proceed. Live organic file has been seen with trustedWorkspaces[]."

[[streams]]
id = "history"
glob = "history.jsonl"
