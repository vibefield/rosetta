data_root = "~/.codex"
notes = "Mock via [model_providers.mock] base_url + env_key in config.toml. CONFIRMED 0.149.1: SQLite stores landed (goals_1/logs_2/memories_1/queue_1.sqlite, WAL) alongside JSONL rollouts. `exec resume --last` appends to the same rollout. Declares exec_command (not shell) as its tool. Include compaction scenarios — rollouts embed compaction history."
