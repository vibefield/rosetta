format = "rosetta-layout/1"
agent = "copilot"
data_root = "~/.copilot"

[[streams]]
id = "events"
glob = "session-state/*/events.jsonl"
file_format = "jsonl"
discipline = "append_only"
evidence = "fixture"
notes = "Primary session event log. Envelope: id, timestamp, parentId, type, data; optional agentId/ephemeral. Writer JSON Schema (npm copilot-*/schemas/session-events.schema.json) lists ~53 persisted types and ~63 ephemeral streaming types that are NOT written to disk. Fixtures prove the subset the CLI actually persists. session-store.db is stripped at harvest; its one non-derived table is described on the session-store stream."

[[streams]]
id = "session-plans"
glob = "session-state/*/plan.md"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Per-session agent planning document when plan mode is used."

[[streams]]
id = "session-checkpoints"
glob = "session-state/*/checkpoints/**"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Checkpoint history. 1.0.80 writes checkpoints/index.md (markdown table); compaction scenarios may add numbered JSON snapshots."

[[streams]]
id = "session-files"
glob = "session-state/*/files/**"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Session-scoped artifacts the agent created during the turn."

[[streams]]
id = "session-research"
glob = "session-state/*/research/**"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Per-session research/ scratch directory. The CLI creates it empty on every farmed session; no files observed yet."

[[streams]]
id = "session-workspace"
glob = "session-state/*/workspace.yaml"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Per-session workspace metadata: id, cwd, client_name, name, timestamps."

[[streams]]
id = "session-db"
glob = "session-state/*/session.db*"
file_format = "sqlite"
discipline = "database"
evidence = "fixture"
notes = "Per-session SQLite (todos, todo_deps, inbox_entries). Distinct from the global session-store.db store. The agent documents this as the default 'session' SQL database in system.message."

[[streams]]
id = "rewind-snapshots"
glob = "session-state/*/rewind-file-snapshots/**"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Rewind/file-snapshot tracking. 1.0.80 writes tracking.json {schema, tracking}."

[[streams]]
id = "session-locks"
glob = "session-state/*/inuse.*.lock"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Volatile process locks; stripped at harvest."

[[streams]]
id = "session-store"
glob = "session-store.db*"
file_format = "sqlite"
discipline = "database"
evidence = "observed"
notes = "Global WAL-mode SQLite store (+ -wal/-shm) written by the native runtime; mixed provenance. sessions, turns, checkpoints, session_files, session_refs, search_index* and dynamic_context_items are derived from events.jsonl (rebuilt by `/chronicle reindex`) and repeat transcript content: MUST-NOT-PARSE. assistant_usage_events (since CLI 1.0.69, changelog 'Show exact local assistant usage in Chronicle and session SQL') is NOT derived: one row per model request, written live by the runtime's usage processor from the ephemeral assistant.usage event that events.jsonl never persists, never updated or deleted (the runtime's DELETE statements touch only search_index, dynamic_context_items and inbox_entries). Columns: id, session_id, turn_index, agent_id, parent_tool_call_id, model, input_tokens (includes cache reads and writes), output_tokens (includes reasoning), cache_read_tokens, cache_write_tokens (1.0.88: 5-minute plus 1-hour writes), reasoning_tokens, total_nano_aiu (10^9 nano-AIU per AI credit, one credit = $0.01; 0 or NULL when GitHub did not meter the call, e.g. BYOK), request_multiplier, duration/latency columns, initiator, api_endpoint, reasoning_effort, finish_reason, content_filter_triggered, token_details_json (the CAPI copilot_usage tokenDetails array: tokenType in input | cache_read | cache_write | cache_write_1h | output with exclusive tokenCount, batchSize, costPerBatch; 1.0.88 entries may carry a model), created_at (ISO 8601 UTC text). The 1.0.88 runtime migrates in copilot_usage_model (the billing model) and output_ttft_ms. The adapter's snapshot plan reads ONLY this table. Evidence: structure-only observed census of a 1.0.80-written store (schema_version 6) plus the runtime DDL for 1.0.80 and 1.0.88; the farm still strips this database at harvest, so a hermetic capture that keeps it is pending."

[[streams]]
id = "settings"
glob = "settings.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "User-editable JSONC settings (model, autoUpdate, remoteExport, …). Farm writes a hermetic stub; the CLI may rewrite it."

[[streams]]
id = "config"
glob = "config.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Automatically managed application state (JSONC with leading comments). May contain authentication — MUST-NOT-PARSE beyond inventory. Farm observed firstLaunchAt only."

[[streams]]
id = "permissions"
glob = "permissions-config.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Saved tool/directory approvals keyed by absolute project path."

[[streams]]
id = "mcp-config"
glob = "mcp-config.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "User-level MCP server definitions."

[[streams]]
id = "lsp-config"
glob = "lsp-config.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "User-level LSP server definitions."

[[streams]]
id = "logs"
glob = "logs/**/*"
file_format = "text"
discipline = "append_only"
evidence = "research"
notes = "Per-process debug logs (`process-{timestamp}-{pid}.log`). Volatile; stripped at harvest."

[[streams]]
id = "command-history"
glob = "command-history-state/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Interactive reverse-search command history. Not transcript ground truth."

[[streams]]
id = "agents"
glob = "agents/**/*"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Personal custom agent definitions (*.agent.md)."

[[streams]]
id = "skills"
glob = "skills/**/*"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Personal custom skills (SKILL.md trees)."

[[streams]]
id = "hooks"
glob = "hooks/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "User-level hook scripts."

[[streams]]
id = "instructions"
glob = "instructions/**/*"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Additional personal *.instructions.md files."

[[streams]]
id = "copilot-instructions"
glob = "copilot-instructions.md"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Personal custom instructions applied to every session."

[[streams]]
id = "extensions"
glob = "extensions/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "User-authored extension files."

[[streams]]
id = "installed-plugins"
glob = "installed-plugins/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Marketplace plugin payloads. Vendor bundle; stripped at harvest."

[[streams]]
id = "plugin-data"
glob = "plugin-data/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Persistent data owned by installed plugins."

[[streams]]
id = "ide"
glob = "ide/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "IDE integration lock files (VS Code)."

[[streams]]
id = "mcp-oauth"
glob = "mcp-oauth-config/**/*"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "MCP OAuth fallback tokens — MUST-NOT-PARSE; inventory only."

[[streams]]
id = "mcp-secrets"
glob = "mcp-secrets/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "MCP secret placeholder fallback storage — MUST-NOT-PARSE; inventory only."
