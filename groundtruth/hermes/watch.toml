# Hermes (Nous Research) — Tier A. Plan: docs/groundtruth/RESEARCH_PLAN.md §5.1

[groundtruth]
status = "captured"
known_gaps = [
  "Farm rows cover the six core logical tables; gateway routing, async delegation, and compaction state are schema-only.",
]

[agent]
name = "hermes"
display = "Hermes Agent"
vendor = "Nous Research"
tier = "A"

[release]
channel = "github-releases"              # dual tags: semver v0.20.x + calver v2026.x.y — normalize to semver
id = "NousResearch/hermes-agent"
surveyed = "0.20.5"                      # 2026-08-24; multiple releases per week
pinned = "0.20.5"                       # fixtures + groundtruth doc committed (2026-08-24)
git_tag = "v2026.8.19"                   # GitHub/Docker calver tag; --version is 0.20.5
docker_image = "nousresearch/hermes-agent:v2026.8.19"
changelog = "https://github.com/NousResearch/hermes-agent/releases"

[source]
repo = "https://github.com/NousResearch/hermes-agent"   # MIT, Python
persistence_paths = [
  "hermes_state.py",                     # SessionDB: WAL, _reconcile_columns(), export_session()
  "website/docs/developer-guide/session-storage.md",
]

[fixture]
headless = "hermes chat --query-file <prompt> --yolo --quiet --ignore-rules --toolsets terminal"
mock_dialect = "openai-chat"             # CONFIRMED 0.20.5: model.provider=custom + model.base_url + model.api_key in config.yaml
home_env = "HERMES_HOME"
data_root = "~/.hermes"
notes = "Install via Docker image nousresearch/hermes-agent:<git_tag>, falling back to git clone @ git_tag + uv sync (CPython 3.13; package requires-python <3.14). Mock via config.yaml model.provider=custom + model.base_url. Store is SQLite state.db (WAL; schema_version=26 at 0.20.5). Harvest the .db plus WAL/SHM when present, dump sqlite3 .schema to sources/, and dump non-empty table JSONL next to stdout. Legacy JSONL in sessions/ is dead. Credentials (.env, auth.json), vendor skills/cache/logs, and .update_check are stripped."
