evidence = "research"
notes = "Background task persistence: status/pid/exit code per task_id. Unseen in fixtures and organic census."

[[streams]]
id = "task-logs"
glob = "sessions/*/*/tasks/**/*.log"
file_format = "text"
discipline = "append_only"
evidence = "research"
notes = "Background task output logs. Unseen in fixtures and organic census."

[[streams]]
