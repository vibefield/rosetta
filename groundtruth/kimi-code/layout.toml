evidence = "research"
notes = "Plan-mode documents named by plan id. `--plan` does not combine with headless `-p`. Unseen in fixtures and organic census."

[[streams]]
id = "plan-revisions"
glob = "sessions/*/*/agents/*/plan/**/*"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Versioned plan bodies offloaded from wire (plan.revision records). Unseen in fixtures and organic census."

[[streams]]
