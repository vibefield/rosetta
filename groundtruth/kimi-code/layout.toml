file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Installed plugin records and enabled state. Unseen in fixtures and organic census."

[[streams]]
id = "plugins-managed"
glob = "plugins/managed/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Vendor copies of plugins installed from zip/local paths — excluded from harvest."

[[streams]]
id = "skills"
glob = "skills/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Kimi-specific user-level Skills; generic .agents/skills stay under real HOME. Excluded from harvest."

[[streams]]
id = "agents-md"
glob = "AGENTS.md"
file_format = "markdown"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Global Kimi-specific agent instructions. Unseen in fixtures and organic census."

[[streams]]
id = "server-token"
glob = "server.token"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "kimi web persistent bearer token (`<KIMI_CODE_HOME>/server.token`, 0600) written on first web boot. MUST-NOT-PARSE. Not produced by headless -p."

[[streams]]
id = "server"
glob = "server/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "kimi web instance registry (server/lock, server/instances/). Legacy vs current layouts differ. Not produced by headless -p."
