# Kimi Code CLI (Moonshot AI) — Tier A. Plan: docs/groundtruth/RESEARCH_PLAN.md §5.4

[groundtruth]
status = "captured"
known_gaps = [
  "Input-image normalization has writer-derived conformance tests; an isolated native image-prompt capture is still needed.",
  "The adapter types the pinned fixture plus version-scoped organic durable vocabulary; several organic-only variants still lack a pinned writer export or hermetic fixture.",
  "Kimi Code 2.0.2 (auto-update 2026-09-22) fork semantics — the forked wire marker, forkedFrom/createdAt on state.json, optional llm.request fields, unclamped inputOther — are declared from the installed bundle (sources/2.0.2.writer.json) and proven by synthetic adapter tests; isolated whole-session and turn-sliced fork captures, plus a 2.0.2 usage scenario, are still needed.",
]

[agent]
name = "kimi-code"
display = "Kimi Code CLI"
vendor = "Moonshot AI"
tier = "A"

[release]
channel = "npm"
id = "@moonshot-ai/kimi-code"
surveyed = "2.0.2"                       # 2026-09-22 auto-update on this machine; still protocol 1.5 wires, fork marker + optional llm.request fields declared from the bundle
pinned = "0.38.0"                        # fixtures + groundtruth doc committed (2026-08-25)
changelog = "https://www.kimi.com/code/docs"     # treat kimi.com/code as canonical among the three doc mirrors

[source]
repo = "https://github.com/MoonshotAI/kimi-code"
persistence_paths = [
  "packages/transcript/",
  "packages/agent-core-v2/",
  "docs/en/configuration/data-locations.md",
]

[fixture]
headless = "kimi -p <prompt> --output-format stream-json"
mock_dialect = "openai-chat"             # zero-config env synth: KIMI_MODEL_NAME + KIMI_MODEL_API_KEY + KIMI_MODEL_BASE_URL + KIMI_MODEL_PROVIDER_TYPE
home_env = "KIMI_CODE_HOME"
data_root = "~/.kimi-code"
notes = "-p implicitly auto-approves tools — container isolation mandatory. Regular provider keys are NOT read from env (config.toml only); the KIMI_MODEL_* synth is the exception (KIMI_MODEL_NAME + KIMI_MODEL_API_KEY + KIMI_MODEL_BASE_URL + KIMI_MODEL_PROVIDER_TYPE=openai). `--plan` does not combine with `-p`. Subagents are the Agent tool (profiles coder/explore/plan) writing agents/agent-N/wire.jsonl. Legacy ~/.kimi layout differs (context.jsonl+wire.jsonl); `kimi migrate` imports it. Harvest strips credentials/, oauth/, bin/, updates/, skills/, plugins/managed/, cache/ (query-store + client-configs), telemetry/, search-index/, server/, server.token."
