format = "rosetta-layout/1"
agent = "opencode"
data_root = "~/.local/share/opencode"

[[streams]]
id = "opencode-db"
glob = "opencode.db*"
file_format = "sqlite"
discipline = "database"
evidence = "fixture"
notes = "Current (v1.2+) session store: Drizzle/SQLite WAL at opencode.db (+ -wal/-shm). Fixtures 1.18.22 keep journal_mode=WAL; redaction checkpoints into the main file so the committed db is complete. basic-chat uses the non-git `global` project; tool-use/resume init a git worktree so project.id is a hash and vcs=`git`. Conversational truth is message.data (role) and part.data (type); the event table is an append-only streaming log (session.created.1 / session.updated.1 / message.updated.1 / message.part.updated.1). credential/account tables exist and MUST-NOT-PARSE. Schema dump: sources/<version>.sqlite-schema.sql."

[[streams]]
id = "auth"
glob = "auth.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Provider credentials — MUST-NOT-PARSE; inventory only, excluded from harvests."

[[streams]]
id = "log"
glob = "log/**/*"
file_format = "text"
discipline = "append_only"
evidence = "fixture"
notes = "CLI/TUI diagnostic logs under Global.Path.log. Farm harvests log/opencode.log."

[[streams]]
id = "legacy-session"
glob = "storage/session/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 per-record JSON sessions (storage/session/<projectID>/ses_*.json). Both formats exist in the wild; current writer is SQLite."

[[streams]]
id = "legacy-message"
glob = "storage/message/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 per-message JSON (storage/message/<sessionID>/msg_*.json)."

[[streams]]
id = "legacy-part"
glob = "storage/part/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 per-part JSON (storage/part/<messageID>/prt_*.json)."

[[streams]]
id = "legacy-project"
glob = "storage/project/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 project records under storage/project/."

[[streams]]
id = "legacy-session-diff"
glob = "storage/session_diff/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 session diff snapshots."

[[streams]]
id = "legacy-share"
glob = "storage/share/**/*.json"
file_format = "json"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Pre-1.2 share records."

[[streams]]
id = "storage-migration"
glob = "storage/migration"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "JSON-storage migration marker (integer generation)."

[[streams]]
id = "snapshot"
glob = "snapshot/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "fixture"
notes = "Git worktree snapshots at snapshot/<project-hash>/<snapshot-hash>/ (HEAD, config, objects, index). Farm strips snapshot/**/hooks (git init template samples). Present only when the cwd is a git repo."

[[streams]]
id = "tool-output"
glob = "tool-output/**/*"
file_format = "text"
discipline = "append_only"
evidence = "research"
notes = "Persisted tool output blobs."

[[streams]]
id = "repos"
glob = "repos/**/*"
file_format = "text"
discipline = "rewrite_in_place"
evidence = "research"
notes = "Cloned repository cache (Global.Path.repos)."
