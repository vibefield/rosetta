# OpenCode (Anomaly Co, ex-SST) — Tier A. Plan: docs/groundtruth/RESEARCH_PLAN.md §5.3

[groundtruth]
status = "captured"
known_gaps = [
  "The current SQLite store is fixture-backed; legacy JSON generations and external tool-output bodies remain research-only.",
]

[agent]
name = "opencode"
display = "OpenCode"
vendor = "Anomaly Co"
tier = "A"

[release]
channel = "npm"                          # near-daily releases — batch into weekly roll-up PRs
id = "opencode-ai"
surveyed = "1.18.23"                     # 2026-08-28
pinned = "1.18.22"                       # fixtures; 1.18.23 writer schema also merged
changelog = "https://github.com/anomalyco/opencode/releases"

[source]
repo = "https://github.com/anomalyco/opencode"   # sst/opencode redirects here
persistence_paths = [
  "packages/opencode/src/storage/",
  "packages/opencode/src/session/",
]

[fixture]
headless = "opencode run <prompt> -m mock/mock-model --format json --auto"
mock_dialect = "openai-chat"             # provider block: "npm": "@ai-sdk/openai-compatible" + local baseURL
home_env = "OPENCODE_DB"                 # overrides DB path; XDG dirs otherwise — run in container HOME
data_root = "~/.local/share/opencode"
notes = "Storage migrated (~v1.2+) from per-record JSON to SQLite opencode.db — both formats exist in the wild; 1.18.22 hermetic runs write SQLite only. Farm: empty HOME+XDG_*+OPENCODE_DB, project opencode.json openai-compatible mock, re-run postinstall.mjs, git-init tool-use/resume (keep basic-chat as global), strip auth.json and snapshot hooks. WAL journal kept. Schema-dump diff is the sqlite drift signal."
